<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octopus</title>
<style>
  /* 设计系统移植自 docs/superpowers/designs/2026-09-19-options-redesign-mockup.html（已认可稿）。
     仅两处产品约束为本页特有：body 字号走 --font-size（ui.fontSize 即时生效）；
     main[data-preview] 预览态降透明度（保留指针事件，预览页本无可写存储）。 */
  :root {
    --bg: #12141c;
    --surface: #1a1e2a;
    --surface-2: #202634;
    --line: #2a3040;
    --line-soft: #232838;
    --ink: #e8ebf4;
    --ink-2: #9aa3b8;
    --ink-3: #6b7488;
    --gold: #e3c987;
    --gold-soft: rgba(227, 201, 135, .14);
    --dusk: #8fb3d9;
    --radius: 10px;
    --font-serif: "Noto Serif SC", "Songti SC", serif;
    --font-sans: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 var(--font-size, 13px)/1.65 var(--font-sans);
    padding: 0 20px 80px;
  }
  main { min-width: 0; padding: 26px 0 0 40px; }
  main[data-preview] { opacity: .7; }

  /* ---------- M1 三翼骨架（侧边栏 + 视图，取自 docs/design/m1-mockup.html 认可稿） ---------- */
  .opt-page { max-width: 920px; margin: 24px auto 80px; display: grid; grid-template-columns: 216px 1fr; gap: 0; }
  aside {
    position: sticky; top: 24px; align-self: start;
    border-right: 1px solid var(--line-soft); padding: 26px 18px 18px 0;
    display: flex; flex-direction: column; min-height: 560px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 22px; }
  .brand img { width: 40px; height: 40px; border-radius: 11px; }
  .brand b { font: 600 17px/1.2 var(--font-serif); letter-spacing: .06em; display: block; }
  .brand small { color: var(--ink-3); font-size: 11px; }
  nav { display: grid; gap: 2px; }
  nav button {
    position: relative; display: flex; align-items: center; gap: 11px;
    background: none; border: 0; color: var(--ink-2); font: 500 13px/1 var(--font-sans);
    padding: 10px 12px; border-radius: 9px; cursor: pointer; text-align: left;
    transition: color .2s, background .2s;
  }
  nav button svg { flex: none; color: var(--ink-3); transition: color .2s; }
  nav button:hover { color: var(--ink); background: var(--surface); }
  nav button.is-active { color: var(--gold); background: var(--gold-soft); }
  nav button.is-active svg { color: var(--gold); }
  nav button.is-active::before {
    content: ""; position: absolute; left: -18px; top: 8px; bottom: 8px; width: 3px;
    border-radius: 2px; background: var(--gold);
  }
  nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .side-foot { margin-top: auto; padding: 16px 12px 0; color: var(--ink-3); font-size: 11px; }

  .view { display: none; }
  .view.is-on { display: block; }

  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
  .page-head h2 { margin: 0; font: 600 22px/1.3 var(--font-serif); letter-spacing: .05em; }
  .page-head p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
  .reset {
    background: none; border: 1px solid var(--line); color: var(--ink-2);
    font: 400 13px/1 var(--font-sans); padding: 7px 14px; border-radius: 999px; cursor: pointer; flex: none;
  }
  .reset:hover { border-color: var(--ink-3); color: var(--ink); }

  @media (max-width: 760px) {
    .opt-page { grid-template-columns: 1fr; }
    aside { position: static; border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 18px 24px 14px; min-height: 0; }
    nav { grid-auto-flow: column; grid-template-columns: repeat(3, 1fr); }
    nav button.is-active::before { display: none; }
    .side-foot { display: none; }
    main { padding-left: 24px; padding-right: 24px; }
    .seats { grid-template-columns: 1fr; }
  }

  /* ---------- 天际线大开关（唯一记忆点） ---------- */
  .dusk {
    position: relative; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px;
    padding: 26px 28px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    transition: background .5s ease;
  }
  .dusk::before { /* 地平线上的天光 */
    content: ""; position: absolute; inset: auto 0 0 0; height: 92px;
    background:
      radial-gradient(58% 90px at 22% 100%, rgba(143,179,217,.16), transparent 70%),
      radial-gradient(50% 70px at 78% 100%, rgba(227,201,135,.12), transparent 70%);
    pointer-events: none;
  }
  .dusk-copy h2 { margin: 0 0 4px; font: 600 20px/1.3 var(--font-serif); letter-spacing: .04em; }
  .dusk-copy p { margin: 0; color: var(--ink-2); font-size: 13px; }

  .dusk-switch { position: relative; flex: none; width: 128px; height: 56px; cursor: pointer; }
  .dusk-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sky {
    position: absolute; inset: 0; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); overflow: hidden;
    transition: background .6s ease, border-color .6s ease;
  }
  .orb { /* 太阳/月亮共用一枚星体 */
    position: absolute; top: 50%; left: 14px; width: 26px; height: 26px; border-radius: 50%;
    translate: 0 -50%;
    background: var(--dusk); box-shadow: 0 0 14px rgba(143,179,217,.55);
    transition: left .45s cubic-bezier(.45,0,.25,1), background .45s ease, box-shadow .45s ease, border-radius 0s;
  }
  .orb::after { /* 月牙缺口，默认藏 */
    content: ""; position: absolute; inset: 4px 0 0 4px; border-radius: 50%;
    background: var(--surface); opacity: 0; transition: opacity .45s ease .1s;
  }
  .stars { position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease .15s; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--ink-2); }
  .stars i:nth-child(1) { top: 12px; right: 34px; } .stars i:nth-child(2) { top: 30px; right: 58px; }
  .stars i:nth-child(3) { top: 20px; right: 84px; } .stars i:nth-child(4) { top: 40px; right: 40px; }
  .dusk-switch input:checked ~ .sky { background: #171b28; border-color: #39415a; }
  .dusk-switch input:checked ~ .sky .orb {
    left: 88px; background: var(--gold); box-shadow: 0 0 16px rgba(227,201,135,.6);
  }
  .dusk-switch input:checked ~ .sky .orb::after { opacity: 1; background: #171b28; }
  .dusk-switch input:checked ~ .sky .stars { opacity: 1; }
  .dusk-switch input:focus-visible ~ .sky { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- 分区骨架 ---------- */
  section { margin-top: 36px; }
  .sec-head {
    display: flex; align-items: baseline; gap: 14px;
    border-bottom: 1px solid var(--line-soft); padding-bottom: 10px; margin-bottom: 18px;
  }
  .sec-head h3 { margin: 0; font: 600 16px/1.3 var(--font-serif); letter-spacing: .08em; }
  .sec-head .note { color: var(--ink-3); font-size: 12px; }

  /* ---------- 主题三席 ---------- */
  .seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .seat {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); padding: 14px 16px; cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
    position: relative;
  }
  .seat:hover { border-color: var(--ink-3); }
  .seat input { position: absolute; opacity: 0; pointer-events: none; }
  .seat .seat-title { display: block; font-weight: 500; margin-bottom: 3px; }
  .seat .seat-desc { display: block; color: var(--ink-3); font-size: 12px; line-height: 1.5; }
  .seat:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
  .seat:has(input:checked) .seat-title { color: var(--gold); }
  .seat:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
  .palette-pop {
    margin-top: 12px; border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 14px 16px; display: none;
  }
  .palette-pop.open { display: block; }
  .palette-pop .pop-label { color: var(--ink-3); font-size: 12px; margin-bottom: 10px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- 通用行控件 ---------- */
  .row { display: flex; align-items: center; gap: 16px; padding: 7px 0; }
  .row .row-label { flex: none; width: 4.5em; color: var(--ink-2); }
  .row output { color: var(--ink-3); font-size: 12px; width: 3em; text-align: right; padding-right: 6px; flex: none; }
  input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold) var(--fill, 50%), var(--surface-2) var(--fill, 50%));
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
  .ct-dot { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); }

  .inline-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
  .inline-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .inline-switch .track {
    position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); transition: background .25s ease, border-color .25s ease;
  }
  .inline-switch .knob {
    position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink-3); transition: left .25s ease, background .25s ease;
  }
  .inline-switch input:checked ~ .track { background: var(--gold-soft); border-color: var(--gold); }
  .inline-switch input:checked ~ .knob { left: 21px; background: var(--gold); }
  .inline-switch input:focus-visible ~ .track { outline: 2px solid var(--gold); outline-offset: 2px; }
  .dimmed { opacity: .58; pointer-events: none; }

  input[type="time"] {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 8px; padding: 6px 10px; font: inherit; color-scheme: dark;
  }
  input[type="time"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* ---------- 站点管理 ---------- */
  .site-mode { display: flex; gap: 10px; margin-bottom: 12px; }
  .site-mode label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
    font-size: 13px; color: var(--ink-2); transition: border-color .2s, color .2s, background .2s;
  }
  .site-mode input { position: absolute; opacity: 0; pointer-events: none; }
  .site-mode label:has(input:checked) { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .site-mode label:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
  textarea {
    width: 100%; min-height: 88px; resize: vertical;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--ink); font: inherit; padding: 10px 12px;
  }
  textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .cols { columns: 2; }
  .hint { color: var(--ink-3); font-size: 12px; margin-top: 8px; }

  /* ---------- 倍速翼(Task 2;规则取自 docs/design/m1-mockup.html 认可稿) ---------- */
  section.opt-sec { margin-top: 34px; }
  .sec-head h4 { margin: 0; font: 600 16px/1.3 var(--font-serif); letter-spacing: .08em; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pill {
    border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--ink-2);
    font: 500 12px/1 var(--font-sans); padding: 7px 14px; cursor: pointer;
  }
  .pill.on { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .stepper { display: inline-flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .stepper button { background: var(--surface); border: 0; color: var(--ink-2); width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
  .stepper button:hover { color: var(--gold); }
  .stepper output { min-width: 64px; text-align: center; color: var(--ink); font-size: 13px; }
  .go-hint {
    margin-top: 26px; border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 12px 16px; color: var(--ink-2); font-size: 12px; display: flex; gap: 8px; align-items: baseline;
  }

  /* ---------- 通用翼(Task 3;规则取自 docs/design/m1-mockup.html 认可稿) ---------- */
  .kbd-table { width: 100%; border-collapse: collapse; }
  .kbd-table td { padding: 8px 4px; border-bottom: 1px solid var(--line-soft); }
  .kbd-table td:first-child { color: var(--ink-2); }
  kbd {
    display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px;
    background: var(--surface); padding: 2px 8px; font: 500 11px/1.4 var(--font-sans); color: var(--ink);
    margin-left: 6px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    color: var(--ink); font: 400 13px/1 var(--font-sans); padding: 9px 16px; cursor: pointer;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.ghost { background: none; }
  .tag-new {
    border: 1px solid var(--gold); color: var(--gold); border-radius: 999px;
    font-size: 10px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px;
  }

  /* ---------- 高级折叠 ---------- */
  details.adv { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 22px; }
  details.adv summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
    font: 600 16px/1.3 var(--font-serif); letter-spacing: .08em;
    padding: 10px 12px; margin: 0 -12px; border-radius: 8px;
    transition: background .2s ease, color .2s ease;
  }
  details.adv summary:hover { background: var(--surface); color: var(--gold); }
  details.adv summary:hover .chev { color: var(--gold); }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary .chev { transition: rotate .25s ease; color: var(--ink-3); font-size: 12px; }
  details.adv[open] summary .chev { rotate: 90deg; }
  details.adv summary .count { margin-left: auto; color: var(--ink-3); font: 400 12px/1 var(--font-sans); letter-spacing: 0; }
  .adv-groups { margin-top: 20px; display: grid; gap: 22px; }
  .adv-group h4 { margin: 0 0 8px; font: 500 13px/1.4 var(--font-sans); color: var(--ink-2); }

  @media (max-width: 620px) {
    .seats { grid-template-columns: 1fr; }
    .dusk { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="opt-page">
  <aside>
    <div class="brand">
      <img src="icons/toolbar/128.png" alt="Octopus">
      <div><b>Octopus</b><small>工具的瑞士军刀</small></div>
    </div>
    <nav id="opt-nav">
      <button type="button" data-wing="veil" class="is-active">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.2 9.9A5.6 5.6 0 1 1 6.2 2.7a4.5 4.5 0 0 0 7 7.2z"/></svg>夜幕
      </button>
      <button type="button" data-wing="pace">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 4.2 7 8l-4.5 3.8z"/><path d="M8.5 4.2 13 8l-4.5 3.8z"/></svg>倍速
      </button>
      <button type="button" data-wing="gen">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h12M2 8h12M2 11.5h12"/><circle cx="6" cy="4.5" r="1.6" fill="var(--bg)"/><circle cx="10.5" cy="8" r="1.6" fill="var(--bg)"/><circle cx="5" cy="11.5" r="1.6" fill="var(--bg)"/></svg>通用
      </button>
    </nav>
    <div class="side-foot" id="side-foot">Octopus</div>
  </aside>
  <main>
    <div class="view is-on" data-wing="veil">
      <div class="page-head">
        <div><h2>夜幕</h2><p>暗色浏览——拉上夜幕,或按站点、按时段安放</p></div>
        <button class="reset" id="reset" type="button"></button>
      </div>
  <!-- 天际线大开关容器（main.js 填充） -->
  <div class="dusk" id="nv-dusk-host"></div>

  <section id="sec-theme"></section>
  <section id="sec-colortemp"></section>
  <section id="sec-schedule"></section>
  <section id="sec-sites"></section>

  <details class="adv" id="sec-advanced">
    <summary id="adv-summary"></summary>
    <div class="adv-groups">
      <div class="adv-group" id="adv-engine"></div>
      <div class="adv-group" id="adv-guard"></div>
      <div class="adv-group" id="adv-rules"></div>
      <div class="adv-group" id="adv-misc"></div>
    </div>
  </details>
    </div>
    <div class="view" data-wing="pace"><div id="opt-pace"></div></div>
    <div class="view" data-wing="gen"><div id="opt-gen"></div></div>
  </main>
</div>
<script src="options.js"></script>
</body>
</html>
