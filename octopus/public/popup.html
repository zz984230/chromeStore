<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Octopus</title>
<style>
  /* 设计系统移植自 docs/superpowers/designs/2026-09-19-popup-mockup.html（已认可稿）。
     稿件画布专属的不移植：body 深色底 #0c0e14、.panel 边框/阴影/360px 定宽、
     .variant-tag、演示 <script>——popup 即面板本身，故 body 背景取 var(--bg)、
     宽度 360px 由 body 承担；两变体合一（结构以变体一为基底），内容由 Task 3 填充。
     另：mockup 面板级 role="group" aria-label="夜幕快捷面板" 未随 .panel 移植（文档 title 已命名）。 */
  :root {
    --bg: #12141c;
    --surface: #1a1e2a;
    --surface-2: #202634;
    --line: #2a3040;
    --line-soft: #232838;
    --ink: #e8ebf4;
    --ink-2: #9aa3b8;
    --ink-3: #6b7488;
    --gold: #e3c987;
    --gold-soft: rgba(227, 201, 135, .14);
    --dusk: #8fb3d9;
    --radius: 10px;
    --font-serif: "Noto Serif SC", "Songti SC", serif;
    --font-sans: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  /* 壳合并适配：原 NV body 整条规则拆开——body 只留页级 margin/底色（#oct-tabs
     直接贴在 body 上，无底色会露白），width/color/font 下放 .oct-body 面板区。 */
  body {
    margin: 0; background: var(--bg);
  }
  .oct-body {
    width: 360px; color: var(--ink);
    font: 400 13px/1.6 var(--font-sans);
  }

  /* ---- 壳：工具 tab 条 ---- */
  #oct-tabs { display: flex; gap: 4px; padding: 8px 10px 0; }
  /* 壳润色：tab 字标 SVG + 激活态金线刻痕（与 options 侧栏竖刻同语言，此处横刻置 tab 底缘）。
     字标取 Task 1 的 path，13px；::after 依赖 button 的 position:relative。 */
  #oct-tabs button { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    padding: 7px 4px; border: 0; border-radius: 8px 8px 0 0;
    background: transparent; color: var(--ink-2, #9aa0ae); font: inherit; font-size: 13px; cursor: pointer; }
  #oct-tabs button svg { color: var(--ink-3); }
  #oct-tabs button.is-active { background: var(--bg); color: var(--ink, #f0f2f6); }
  #oct-tabs button.is-active svg { color: var(--gold); }
  #oct-tabs button.is-active::after {
    content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px;
    background: var(--gold); border-radius: 1px;
  }
  .oct-panel.is-hidden { display: none; }

  /* ---- popup 头：紧凑天际线开关 ---- */
  .dusk-mini {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--line-soft);
    background:
      radial-gradient(60% 46px at 20% 100%, rgba(143,179,217,.13), transparent 70%),
      radial-gradient(46% 36px at 80% 100%, rgba(227,201,135,.10), transparent 70%);
  }
  .dusk-mini .copy { display: flex; flex-direction: column; }
  .dusk-mini .copy b { font: 600 15px/1.3 var(--font-serif); letter-spacing: .04em; }
  .dusk-mini .copy span { color: var(--ink-3); font-size: 11px; }
  .dusk-switch { position: relative; flex: none; width: 92px; height: 42px; cursor: pointer; }
  .dusk-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .sky {
    position: absolute; inset: 0; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); overflow: hidden;
    transition: background .5s ease, border-color .5s ease;
  }
  .orb {
    position: absolute; top: 50%; left: 10px; width: 20px; height: 20px; border-radius: 50%;
    translate: 0 -50%;
    background: var(--dusk); box-shadow: 0 0 10px rgba(143,179,217,.5);
    transition: left .4s cubic-bezier(.45,0,.25,1), background .4s ease, box-shadow .4s ease;
  }
  .orb::after {
    content: ""; position: absolute; inset: 3px 0 0 3px; border-radius: 50%;
    background: var(--surface); opacity: 0; transition: opacity .4s ease .08s;
  }
  .stars { position: absolute; inset: 0; opacity: 0; transition: opacity .4s ease .12s; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--ink-2); }
  .stars i:nth-child(1) { top: 9px; right: 24px; } .stars i:nth-child(2) { top: 24px; right: 44px; }
  .stars i:nth-child(3) { top: 15px; right: 60px; }
  .dusk-switch input:checked ~ .sky { background: #171b28; border-color: #39415a; }
  .dusk-switch input:checked ~ .sky .orb { left: 62px; background: var(--gold); box-shadow: 0 0 12px rgba(227,201,135,.55); }
  .dusk-switch input:checked ~ .sky .orb::after { opacity: 1; background: #171b28; }
  .dusk-switch input:checked ~ .sky .stars { opacity: 1; }
  .dusk-switch input:focus-visible ~ .sky { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- 当前站点行 ---- */
  .site-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-bottom: 1px solid var(--line-soft);
  }
  .site-ico {
    flex: none; width: 26px; height: 26px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--ink-3); font-size: 12px;
  }
  .site-name { flex: 1; min-width: 0; }
  .site-name b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-name span { display: block; color: var(--ink-3); font-size: 11px; }
  .site-pill {
    flex: none; border: 1px solid var(--line); border-radius: 999px;
    background: none; color: var(--ink-2); font: 500 12px/1 var(--font-sans);
    padding: 7px 14px; cursor: pointer; transition: border-color .2s, color .2s, background .2s;
  }
  .site-pill.on { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
  .site-pill:hover { border-color: var(--ink-3); color: var(--ink); }
  .site-pill.on:hover { border-color: var(--gold); color: var(--gold); }

  /* ---- 分组 ---- */
  .grp { padding: 12px 18px 14px; border-bottom: 1px solid var(--line-soft); }
  .grp-label { color: var(--ink-3); font-size: 11px; margin-bottom: 9px; letter-spacing: .02em; }
  .seats-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seat-mini {
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    padding: 9px 10px; cursor: pointer; text-align: left; color: var(--ink);
    transition: border-color .2s, background .2s; position: relative;
  }
  .seat-mini:hover { border-color: var(--ink-3); }
  .seat-mini input { position: absolute; opacity: 0; pointer-events: none; }
  .seat-mini .t { display: block; font-size: 12px; font-weight: 500; }
  .seat-mini:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
  .seat-mini:has(input:checked) .t { color: var(--gold); }
  .seat-mini:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- 行控件（紧凑） ---- */
  .row { display: flex; align-items: center; gap: 12px; }
  .row output { color: var(--ink-3); font-size: 11px; min-width: 2.2em; text-align: right; }
  /* 壳合并适配：滑杆是 veil 面板组件，限定 #oct-panel-veil——元素级选择器不限域
     会泄漏进 pace 面板，把 VA 原生 accent-color 滑杆改成 veil 自绘轨道/拇指。 */
  #oct-panel-veil input[type="range"] {
    flex: 1; appearance: none; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--gold) var(--fill, 100%), var(--surface-2) var(--fill, 100%));
    cursor: pointer;
  }
  #oct-panel-veil input[type="range"]::-webkit-slider-thumb {
    appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink); border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line);
  }
  #oct-panel-veil input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .inline-switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
  .inline-switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .inline-switch .track {
    position: absolute; inset: 0; border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); transition: background .25s, border-color .25s;
  }
  .inline-switch .knob {
    position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink-3); transition: left .25s, background .25s;
  }
  .inline-switch input:checked ~ .track { background: var(--gold-soft); border-color: var(--gold); }
  .inline-switch input:checked ~ .knob { left: 19px; background: var(--gold); }
  .inline-switch input:focus-visible ~ .track { outline: 2px solid var(--gold); outline-offset: 2px; }
  .ct-dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); }
  .dimmed { opacity: .55; pointer-events: none; }

  /* ---- 动作钮（面板通用：veil 设置入口 / pace 立即续播） ---- */
  .go {
    margin-top: 8px; width: 100%; padding: 7px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink);
    font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .go:hover { border-color: var(--gold); }
  .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- 底部 ---- */
  .foot {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 12px 18px; color: var(--ink-3); font-size: 12px;
  }
  .foot .go { width: auto; margin: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <nav id="oct-tabs">
    <button type="button" data-tool="veil" class="is-active"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.2 9.9A5.6 5.6 0 1 1 6.2 2.7a4.5 4.5 0 0 0 7 7.2z"/></svg>夜幕</button>
    <button type="button" data-tool="pace"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 4.2 7 8l-4.5 3.8z"/><path d="M8.5 4.2 13 8l-4.5 3.8z"/></svg>倍速</button>
  </nav>
  <main class="oct-body">
    <section id="oct-panel-veil" class="oct-panel">
      <!-- NV 原 body 挂点（render 填充）：容器自带结构类名，内部 DOM 由 tools/veil/popup/main.js 构建 -->
      <div class="dusk-mini" id="pp-dusk-host"></div>
      <div class="site-row" id="pp-site-row"></div>
      <div class="grp" id="pp-seats"></div>
      <div class="grp" id="pp-ct"></div>
      <div class="foot" id="pp-foot"></div>
    </section>
    <section id="oct-panel-pace" class="oct-panel is-hidden">
      <!-- VA 原 body 子元素原样移入，popup.css 内联如下（壳合并适配：
           body 定宽规则整条删除由壳 360px 承担；--ink 与 veil :root 同名异值，
           本块内改名 --vpa-ink；main.card 降为 div.card，文档只保留一个可见 main）。
           2026-10-18 配色统一 veil 家族：pace token 改为 veil 别名引用（单一事实源）；
           .chip--active 改用 veil soft-fill 习惯（--gold-soft 底 + --gold 边/字）；
           .card 镜像 veil 分组表面（--surface 底 + --line 边 + --radius 圆角）。 -->
      <style>
        /* 卡片基调随 veil 家族（token 别名引用）；--glow 取代 M1 的 --accent、.note 取代 .hint（与参考源词汇脱钩） */
        :root {
          --vpa-ink: var(--ink);
          --ink-dim: var(--ink-2);
          --plate: var(--surface-2);
          --plate-edge: var(--line);
          --glow: var(--gold);
        }
        * { box-sizing: border-box; margin: 0; }
        .card { padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
        .card-head { display: flex; align-items: baseline; justify-content: space-between; }
        .card-head h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
        .ver { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

        .stage { margin-top: 12px; text-align: center; }
        .figure {
          font-size: 34px; font-weight: 700;
          font-variant-numeric: tabular-nums;
          color: var(--glow);
        }
        .dial { width: 100%; margin-top: 10px; accent-color: var(--glow); }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .chip {
          padding: 4px 10px; border-radius: 999px;
          border: 1px solid var(--plate-edge);
          background: transparent; color: var(--vpa-ink);
          font-family: inherit;
          font-size: 12px;
          font-weight: 600;
          line-height: 1.4;
          cursor: pointer;
          font-variant-numeric: tabular-nums;
        }
        .chip:hover { border-color: var(--glow); }
        .chip--active { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }

        .note { margin-top: 12px; font-size: 12px; color: var(--ink-dim); }

        .hold-row { margin-top: 12px; }
        .switch {
          display: flex; align-items: center; gap: 8px;
          width: 100%; padding: 7px 12px;
          border: 1px solid var(--plate-edge); border-radius: 10px;
          background: transparent; color: var(--vpa-ink);
          font-family: inherit; font-size: 13px; cursor: pointer;
          text-align: left;
        }
        .switch[aria-pressed="true"] { border-color: var(--glow); }
        .switch-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: var(--ink-dim); flex: none;
        }
        .switch[aria-pressed="true"] .switch-dot { background: var(--glow); }

        .slice { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--plate-edge); }
        .slice-title { font-size: 12px; color: var(--ink-dim); margin-bottom: 8px; }
        .slice-row {
          display: flex; align-items: center; gap: 8px;
          font-size: 13px; margin-bottom: 8px;
        }
        .slice-row input {
          width: 72px; padding: 4px 8px; border-radius: 8px;
          border: 1px solid var(--plate-edge);
          background: transparent; color: var(--vpa-ink);
          font-family: inherit; font-size: 13px; text-align: right;
        }
        .unit { font-size: 12px; color: var(--ink-dim); }
      </style>
      <div class="card">
        <header class="card-head">
          <h1>视频倍速助手</h1>
          <span class="ver" id="app-version">—</span>
        </header>
        <section class="stage">
          <div class="figure" id="pace-figure">1×</div>
          <input type="range" id="pace-dial" class="dial" min="0.07" max="16" step="0.05" value="1" aria-label="播放档位" />
        </section>
        <div class="chips" id="pace-chips"></div>
        <div class="hold-row">
          <button class="switch" id="hold-switch" type="button" aria-pressed="false">
            <span class="switch-dot" aria-hidden="true"></span>
            <span id="hold-label">保持：关</span>
          </button>
        </div>
        <section class="slice">
          <div class="slice-title">跳过片段</div>
          <label class="slice-row"><span>片头</span><input type="number" id="skip-intro" min="0" max="3600" step="1" value="0" /><span class="unit">秒</span></label>
          <label class="slice-row"><span>片尾</span><input type="number" id="skip-outro" min="0" max="3600" step="1" value="0" /><span class="unit">秒</span></label>
          <button class="switch" id="skip-switch" type="button" aria-pressed="false">
            <span class="switch-dot" aria-hidden="true"></span><span id="skip-label">跳过：关</span>
          </button>
        </section>
        <section class="slice">
          <div class="slice-title">自动续播</div>
          <button class="switch" id="advance-switch" type="button" aria-pressed="false">
            <span class="switch-dot" aria-hidden="true"></span><span id="advance-label">续播：关</span>
          </button>
          <button class="go" id="advance-now" type="button">▶ 立即续播</button>
        </section>
        <p class="note" id="pace-note">读取中…</p>
      </div>
    </section>
  </main>

<script src="popup.js"></script>
</body>
</html>
